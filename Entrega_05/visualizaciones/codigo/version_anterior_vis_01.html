<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visualización 1</title><style>body{font:15px system-ui;color:#111;background:#f5f5f0;margin:18px}select{padding:8px} .bar{background:#C6FF36;height:16px;display:inline-block;border:1px solid #637d18} .item{display:grid;grid-template-columns:minmax(100px,1fr) 2fr 75px;gap:8px;align-items:center;margin:8px 0} small{color:#555}</style><h2>Minutos entre los 21 y los 24 años</h2><label>Estadístico <select id="s"><option value="mean">Promedio</option><option value="median">Mediana</option></select></label><p><small>46 jugadores con datos en las cuatro edades; muestra de casos completos, no representativa del universo ni evidencia causal.</small></p><div id="chart"></div><script>const data={"mean": [1068.2, 1177.8, 1304.5, 1318.0], "median": [909.0, 1082.5, 1535.5, 1288.5]};const s=document.querySelector("#s");function draw(){let d=data[s.value],m=Math.max(...d);document.querySelector("#chart").innerHTML=d.map((x,i)=>`<div class="item"><span>${21+i} años</span><div><span class="bar" style="width:${100*x/m}%"></span></div><span>${x}</span></div>`).join("")}s.onchange=draw;draw();</script></html>
